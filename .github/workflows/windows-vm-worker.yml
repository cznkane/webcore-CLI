name: Windows VM management validation

on:
  push:
    branches:
      - feature/allowlisted-vm-tests
  pull_request:
    paths:
      - 'server/vm-*.js'
      - 'windows/**'
      - 'scripts/*VmManagement.ps1'
      - 'test/vm-*.test.js'
      - '.github/workflows/windows-vm-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-worker:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check VM worker modules
        shell: pwsh
        run: |
          Get-ChildItem server/vm-*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Run VM worker tests on Windows
        run: node --test test/vm-approval-ledger.test.js test/vm-release-integrity.test.js test/vm-worker-audit.test.js test/vm-worker-concurrency.test.js test/vm-worker-policy.test.js test/vm-worker-process.test.js test/vm-worker-config.test.js test/vm-worker-coordinator.test.js test/vm-worker-ipc-auth.test.js test/vm-worker-pipe.test.js test/vm-worker-syntax-plan.test.js test/vm-worker-driver.test.js test/vm-worker-end-to-end.test.js test/vm-worker-real-windows.test.js test/vm-worker-frame-handler.test.js
      - name: Compile native security boundary
        shell: powershell
        run: ./scripts/Build-VmManagement.ps1
      - name: Native pipe and identity checks
        shell: powershell
        run: |
          $env:SMART_HOME_TEST_NODE = (Get-Command node.exe).Source
          & ./build/vm-management/VmManagement.exe selftest
          if ($LASTEXITCODE -ne 0) { throw 'Native security checks failed' }
      - name: Real restricted identity and installation integration
        shell: powershell
        run: ./scripts/Test-VmManagementIntegration.ps1
      - name: Full suite on Windows
        run: npm test
      - name: Build pinned installation artifact
        shell: powershell
        run: ./scripts/Package-VmManagement.ps1 -Commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHome-VmManagement-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/SmartHome-VmManagement-*.zip
            build/SmartHome-VmManagement-*.sha256
          if-no-files-found: error
