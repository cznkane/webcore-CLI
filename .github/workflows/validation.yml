name: Validate webcore-CLI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Windows management focused tests
        run: node --test test/windows-management.test.js
        timeout-minutes: 2
      - name: Full suite with per-test timeout
        run: node --test --test-timeout=30000
        timeout-minutes: 7
      - run: npm run check
